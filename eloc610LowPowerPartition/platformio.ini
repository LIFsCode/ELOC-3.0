; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
;
; !!!!!!!!!!!!!!!!!!!!!!!!!!   NOTE  !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
; This scheme uses sdkconfig.defaults to set defaults for all builds.
; Generated sdkconfig for tasks should not be committed to git.
;
; When adding/ changing options, make sure to add them to sdkconfig.defaults
; if possible, so that they are set for all builds. If not possible, add them
; to the build_flags of the specific build.

[platformio]
; Set default build
name = ELOC-3.0
description = ELOC-3.0 build
default_envs = esp32dev

[options]
; Parameters that CAN be reused in one or more environments
;platform = espressif32@~6.1.0
platform = espressif32 @ 6.9.0 ; https://github.com/platformio/platform-espressif32/releases
board = esp32dev
        ;esp-wrover-kit
framework =
    espidf
    arduino
monitor_filters = esp32_exception_decoder, log2file
board_build.partitions = elocPartitions.csv
extra_scripts =
    ; pre:tools/modify_edge-impulse-sdk.py
    pre:tools/patch_fatfs_exfat.py
    pre:tools/patch_ei_fft_cache.py
    pre:tools/checkProjectVer.py
    pre:tools/genVersion.py
    pre:tools/genNVS.py
    post:tools/setUploadMonitorPort.py
build_flags =
;https://docs.platformio.org/en/latest/platforms/espressif32.html#build-flags
; More than this required to enable SPI RAM
;https://github.com/LIFsCode/ELOC-3.0/issues/16#issuecomment-1707275057
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_CACHE_WORKAROUND
    -Wl,-Map,firmware.map
selected_tests =
    ; Modify as necessary to select tests
	test_target_ElocConfig
unit_test_define =
    -D UNIT_TESTING
    -D BUILD_TIME_UNIX=$UNIX_TIME
# Tensorflow libraries break on some warnings
# Ideally this would be limited to lib/edge-impulse/edge-impulse-sdk
build_unflags = -Werror=all

[tflm]
; Shared by every env that links the TFLite Micro runtime (lib/tflite-micro + lib/esp-nn +
; lib/eloc_ml + lib/eloc_detector). TF_LITE_STATIC_MEMORY changes the layout of TfLiteTensor, so every translation
; unit that includes a TFLM header must see it, not only the library itself (upstream exports it
; as an INTERFACE define). The third_party paths are header-only dependencies of the TFLM headers.
build_flags =
    -DTF_LITE_STATIC_MEMORY
    -Ilib/tflite-micro/third_party/flatbuffers/include
    -Ilib/tflite-micro/third_party/gemmlowp
    -Ilib/tflite-micro/third_party/ruy

[env]
; Parameters that WILL be reused in all [env:NAME]
upload_speed = 460800
monitor_speed = 115200
; Static code checking
check_tool = cppcheck
check_flags = --enable=all
board_upload.flash_size=16MB
lib_deps =
    ; Common libraries for all builds
    ; NB: Don't include files from /lib - strange build errors result!
    bblanchon/ArduinoJson@^6.21.2
    pvizeli/CmdParser@0.0.0-alpha+sha.dcaa7eada9
    evert-arias/EasyBuzzer @ 1.0.4
    jgromes/RadioLib@7.4.0   ; exact pin (no caret): 7.7.0 removed SX126x.XTAL and changes LoRaWAN APIs
    mikalhart/TinyGPSPlus@^1.0.3
debug_tool = esp-prog
debug_init_break = tbreak setup

[env:esp32dev]
; Build without Edge Impulse
platform = ${options.platform}
board = ${options.board}
framework = ${options.framework}
monitor_filters = ${options.monitor_filters}
board_build.partitions = ${options.board_build.partitions}
extra_scripts = ${options.extra_scripts}
build_flags = ${options.build_flags}
build_unflags = ${options.build_unflags}
lib_ignore = eloc_ml, eloc_detector, tflite-micro, esp-nn

; AI build flags (see README-ai.md):
;   ELOC_AI_ENABLED     any AI runtime: sampler hookup, status, LoRa events, duty-cycle AI state
;   EDGE_IMPULSE_ENABLED  the Edge Impulse runtime (esp32dev-ei)
;   ELOC_TFLM_ENABLED   the TFLite Micro runtime (esp32dev-tflm)
; Both runtimes define tflite:: symbols, so each AI env must lib_ignore the other's libraries.

[env:esp32dev-ei]
; Build with Edge Impulse
platform = ${options.platform}
board = ${options.board}
framework = ${options.framework}
monitor_filters = ${options.monitor_filters}
board_build.partitions = ${options.board_build.partitions}
extra_scripts = ${options.extra_scripts}
build_flags = ${options.build_flags}
    -DELOC_AI_ENABLED
    -DEDGE_IMPULSE_ENABLED
    # Force static allocation of classifier
    # https://docs.edgeimpulse.com/docs/run-inference/cpp-library/deploy-your-model-as-a-c-library#static-allocation
    # -DEI_CLASSIFIER_ALLOCATION_STATIC=1
build_unflags = ${options.build_unflags}
lib_ignore = eloc_ml, eloc_detector, tflite-micro, esp-nn

[env:esp32dev-tflm]
; Build with the TFLite Micro runtime (Edge Impulse replacement). Runs the device model package
; from ELOC Model Training, compiled in from lib/eloc_ml/model/eloc_model_data.h.
platform = ${options.platform}
board = ${options.board}
framework = ${options.framework}
monitor_filters = ${options.monitor_filters}
board_build.partitions = ${options.board_build.partitions}
extra_scripts = ${options.extra_scripts}
build_flags = ${options.build_flags}
    ${tflm.build_flags}
    -DELOC_AI_ENABLED
    -DELOC_TFLM_ENABLED
build_unflags = ${options.build_unflags}
lib_ignore = edge-impulse

; All unit tests for the ELOC board
[env:target_unit_selected_tests]
platform = ${options.platform}
board = ${options.board}
board_build.partitions = ${options.board_build.partitions}
framework = ${options.framework}
build_flags = ${options.unit_test_define}
build_unflags = ${options.build_unflags}
test_framework = unity
test_filter = ${options.selected_tests}
lib_deps = ${env.lib_deps}
extra_scripts =
    post:tools/setUploadMonitorPort.py


; All unit tests for the ELOC board
[env:target_unit_all_tests]
platform = ${options.platform}
board = ${options.board}
framework = ${options.framework}
build_flags = ${options.unit_test_define}
build_unflags = ${options.build_unflags}
test_framework = unity
test_filter =
    test_target_*
    test_*
test_ignore =
    test_generic_*
    ; needs the TFLM flags, runs in target_tflm_tests
    test_target_tflm
lib_deps = ${env.lib_deps}
   ;ArduinoFake has build errors with ESP-IDF
extra_scripts =
    post:tools/setUploadMonitorPort.py

; On-target test of the TFLite Micro runtime (test/test_target_tflm): runs the golden vectors of
; the compiled-in model package, read from /sdcard/eloc_golden_vectors.bin.
[env:target_tflm_tests]
platform = ${options.platform}
board = ${options.board}
board_build.partitions = ${options.board_build.partitions}
framework = ${options.framework}
build_flags = ${options.unit_test_define}
    ${options.build_flags}
    ${tflm.build_flags}
build_unflags = ${options.build_unflags}
test_framework = unity
test_filter = test_target_tflm
lib_deps = ${env.lib_deps}
lib_ignore = edge-impulse
extra_scripts =
    pre:tools/patch_fatfs_exfat.py
    post:tools/setUploadMonitorPort.py

; Unit tests for desktop
[env:generic_unit_tests]
platform = native
build_flags =
    ${options.unit_test_define}
    -D GENERIC_HW
    ${tflm.build_flags}
    ; TFLite schema headers for ModelPackage; the tflite-micro library itself is not built here
    -Ilib/tflite-micro
; The dependency finder would otherwise follow test includes into the ESP-only libraries (SD card,
; Arduino String...) and fail on the host. Build only what the native tests list.
lib_ldf_mode = off
lib_deps =
    bblanchon/ArduinoJson@^6.21.2
    throwtheswitch/Unity@^2.6.1
    eloc_ml
    mock
test_framework = unity
test_filter =
    test_generic_*
    test_*
test_ignore =
    test_target_*
check_src_filters =
    lib/*
    src/*
    test/*
